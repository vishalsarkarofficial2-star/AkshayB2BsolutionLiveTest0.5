<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>akshayb2bsolutions</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License: https://github.com/rafgraph/spa-github-pages
      // Auto-detect whether this is hosted on a GitHub Pages project repo or a custom/root domain
      var l = window.location;
      var isGithubProject = l.hostname.indexOf('github.io') > -1 && l.pathname.split('/').length > 2 && l.pathname.split('/')[1] !== '';
      var pathSegmentsToKeep = isGithubProject ? 1 : 0;

      // Also set sessionStorage as an additional fallback
      try {
        sessionStorage.setItem('spa_redirect', l.href);
      } catch (e) {}

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <!-- GitHub Pages Single Page Application 404 Redirect Handler -->
  </body>
</html>
