    <script type="text/javascript">
      // Ensure Favicon & Apple Touch Icons resolve accurately on GitHub Pages subpaths and all devices
      (function() {
        try {
          var origin = window.location.origin || (window.location.protocol + '//' + window.location.host);
          var pathParts = window.location.pathname.split('/').filter(Boolean);
          var basePath = '/';
          if (window.location.hostname.indexOf('github.io') !== -1 && pathParts.length > 0) {
            basePath = '/' + pathParts[0] + '/';
          }
          var logoUrl = origin + basePath + 'logo.png';
          var icoUrl = origin + basePath + 'favicon.ico';
          var touchUrl = origin + basePath + 'apple-touch-icon.png';
          
          var updateOrCreateLink = function(rel, href, type) {
            var el = document.querySelector("link[rel='" + rel + "']");
            if (!el) {
              el = document.createElement('link');
              el.setAttribute('rel', rel);
              if (type) el.setAttribute('type', type);
              document.head.appendChild(el);
            }
            el.setAttribute('href', href);
          };

          updateOrCreateLink('icon', logoUrl, 'image/png');
          updateOrCreateLink('shortcut icon', icoUrl, 'image/x-icon');
          updateOrCreateLink('apple-touch-icon', touchUrl);
          updateOrCreateLink('apple-touch-icon-precomposed', touchUrl);
        } catch(e) {}
      })();

      // GitHub Pages SPA Single Page App redirect handler
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        } else {
          try {
            var spaRedirect = sessionStorage.getItem('spa_redirect');
            if (spaRedirect) {
              sessionStorage.removeItem('spa_redirect');
              if (spaRedirect !== l.href) {
                window.history.replaceState(null, null, spaRedirect);
              }
            }
          } catch (e) {}
        }
      }(window.location));
    </script>
